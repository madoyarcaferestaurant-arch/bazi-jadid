name: madoyar_app
description: "Madoyar App - Game Hub & Interactive Portal"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3
  audioplayers: ^6.1.0
  bonfire: ^3.13.0
  flame: 1.37.0
  flame_audio: ^2.10.0
  flame_tiled: ^2.0.0
  flutter_riverpod: ^2.6.1
  gap: ^3.0.1
  logger: ^2.5.0
  lottie: ^3.3.1
  package_info_plus: ^8.3.0
  toastification: ^2.3.0
  window_manager: ^0.4.3
  gem_game:
    path: gems
  ricochlime:
    path: ricochlime

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  vibration: ^3.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/maplestory/
    - assets/beehoney/
    - assets/treasure_hunt/
