tutorialPage:
  tutorial: آموزش
  dragAndRelease: برای شکست هیولاها بکشید، هدف بگیرید و برای شلیک رها کنید.
  pointAndClick: برای هدف‌گیری ماوس را حرکت دهید و برای شلیک کلیک کنید.
  goldMonsters: پس از شکست هیولای طلایی، یک سکه می‌گیرید.
  greenMonsters: پس از شکست هیولای سبز، یک گلوله اضافه می‌گیرید.
  bounceOffWalls: گلوله‌ها را به دیوارها بزنید تا هیولاهای بیشتری را هدف بگیرند.
  tapSpeedUp: برای سریع‌تر شدن گلوله‌ها روی صفحه بزنید.
  skullLine: رسیدن هیولا به خط جمجمه، در صورت شکست نخوردن در حرکت بعدی، پایان بازی است.
  moreMonsters: با پیشرفت شما هر دور ردیف‌های بیشتری از هیولاها ظاهر می‌شود.
  useCoinsInShop: سکه جمع کنید تا آیتم‌های جدید فروشگاه را باز کنید...
